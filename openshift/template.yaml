apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: clusterfoundry
  annotations:
    description: Build and deploy ClusterFoundry for public sandbox testing.
parameters:
  - name: APP_NAME
    description: Application name; use lowercase letters, numbers, and hyphens.
    value: clusterfoundry
    required: true
  - name: NAMESPACE
    description: Your existing OpenShift project name.
    required: true
  - name: GIT_URL
    description: Git repository accessible to the OpenShift build service.
    value: https://github.com/socks5-sniffer/learning-openshift.git
    required: true
  - name: GIT_REF
    description: Branch, tag, or commit containing the Dockerfile.
    value: main
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${APP_NAME}
        app.kubernetes.io/part-of: clusterfoundry
    spec:
      lookupPolicy:
        local: false
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${APP_NAME}
        app.kubernetes.io/part-of: clusterfoundry
    spec:
      runPolicy: Serial
      successfulBuildsHistoryLimit: 2
      failedBuildsHistoryLimit: 2
      source:
        type: Git
        git:
          uri: ${GIT_URL}
          ref: ${GIT_REF}
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
          forcePull: true
      output:
        to:
          kind: ImageStreamTag
          name: ${APP_NAME}:latest
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      triggers: []
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${APP_NAME}
        app.kubernetes.io/name: ${APP_NAME}
        app.kubernetes.io/part-of: clusterfoundry
        app.openshift.io/runtime: nodejs
      annotations:
        app.openshift.io/vcs-uri: ${GIT_URL}
        image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"${APP_NAME}:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]'
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: web
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}:latest
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: NODE_ENV
                  value: production
                - name: HOSTNAME
                  value: 0.0.0.0
                - name: PORT
                  value: "3000"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 768Mi
              startupProbe:
                httpGet:
                  path: /api/hello
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /api/hello
                  port: http
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                httpGet:
                  path: /api/hello
                  port: http
                periodSeconds: 20
                timeoutSeconds: 3
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${APP_NAME}
    spec:
      selector:
        app: ${APP_NAME}
      ports:
        - name: http
          port: 3000
          targetPort: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${APP_NAME}
    spec:
      to:
        kind: Service
        name: ${APP_NAME}
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
